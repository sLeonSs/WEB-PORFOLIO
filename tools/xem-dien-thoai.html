<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giả lập điện thoại</title>
<!-- Trang xem thử index.html ở nhiều khổ máy cùng lúc (iPhone, Android, iPad). Mở bằng F5 → "Xem giả lập điện thoại".
     Mỗi khung là iframe đúng bề rộng máy nên CSS điện thoại/iPad áp dụng y như thật. -->
<style>
  :root{--g:#0a7c52;--g-900:#063d29;--bg:#eef3f0;--ink:#122019}
  *{box-sizing:border-box;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 20px;background:var(--g-900);color:#fff}
  header b{font-size:15px;margin-right:auto}
  header label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
  button{padding:8px 16px;border:0;border-radius:999px;background:#fff;color:var(--g-900);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  main{display:flex;gap:28px;padding:24px 20px 40px;overflow-x:auto;align-items:flex-start}
  .dev{flex:none;text-align:center}
  .dev p{margin-bottom:8px;font-size:13px;font-weight:700;color:var(--g-900)}
  .dev p small{font-weight:500;color:#6b7a73}
  .frame{border:12px solid #111;border-radius:44px;background:#111;box-shadow:0 30px 60px -30px rgba(6,61,41,.5);overflow:hidden}
  .frame.tab{border-radius:28px;border-width:14px}
  iframe{display:block;border:0;background:#fff}
  .dev[hidden]{display:none}
</style>
</head>
<body>
<header>
  <b>Giả lập điện thoại · Lắc Đầu</b>
  <label><input type="checkbox" data-d="ip" checked> iPhone 14/15</label>
  <label><input type="checkbox" data-d="se" checked> iPhone SE</label>
  <label><input type="checkbox" data-d="an" checked> Android</label>
  <label><input type="checkbox" data-d="pad"> iPad dọc</label>
  <button type="button" id="reload">↻ Tải lại tất cả</button>
</header>
<main>
  <div class="dev" id="ip"><p>iPhone 14/15 <small>390×844</small></p><div class="frame"><iframe width="390" height="844" title="iPhone 14/15"></iframe></div></div>
  <div class="dev" id="se"><p>iPhone SE <small>375×667</small></p><div class="frame"><iframe width="375" height="667" title="iPhone SE"></iframe></div></div>
  <div class="dev" id="an"><p>Android <small>360×780</small></p><div class="frame"><iframe width="360" height="780" title="Android"></iframe></div></div>
  <div class="dev" id="pad" hidden><p>iPad dọc <small>820×1180</small></p><div class="frame tab"><iframe width="820" height="1180" title="iPad"></iframe></div></div>
</main>
<script>
  // luôn tải bản mới nhất của index.html (thêm ?t=thời gian để không dùng bản cũ đã lưu)
  function load(f) { f.src = '../index.html?t=' + Date.now(); }
  var frames = [].slice.call(document.querySelectorAll('iframe'));
  frames.forEach(function (f) { if (!f.closest('.dev').hidden) load(f); });
  document.getElementById('reload').onclick = function () {
    frames.forEach(function (f) { if (!f.closest('.dev').hidden) load(f); });
  };
  [].forEach.call(document.querySelectorAll('[data-d]'), function (c) {
    c.onchange = function () {
      var d = document.getElementById(c.dataset.d), f = d.querySelector('iframe');
      d.hidden = !c.checked;
      if (c.checked) load(f);
    };
  });
</script>
</body>
</html>
